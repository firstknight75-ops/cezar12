version: '3.9'

services:
  # ─────────────────────────────────────────────────────
  # PostgreSQL 16
  # ─────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cezar12_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cezar12_dev
      POSTGRES_USER: cezar12
      POSTGRES_PASSWORD: dev_password_change_in_prod
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cezar12 -d cezar12_dev']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - cezar12_network

  # ─────────────────────────────────────────────────────
  # Redis 7
  # ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: cezar12_redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cezar12_network

  # ─────────────────────────────────────────────────────
  # MinIO (S3-compatible local storage)
  # ─────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: cezar12_minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - '9000:9000'   # API
      - '9001:9001'   # Console UI → http://localhost:9001
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cezar12_network

  # ─────────────────────────────────────────────────────
  # MinIO bucket init
  # ─────────────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: cezar12_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin123;
        /usr/bin/mc mb local/cezar12-dev --ignore-existing;
        /usr/bin/mc anonymous set public local/cezar12-dev;
        echo 'MinIO bucket created';
        exit 0;
      "
    networks:
      - cezar12_network

# ─────────────────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

# ─────────────────────────────────────────────────────
# Networks
# ─────────────────────────────────────────────────────
networks:
  cezar12_network:
    driver: bridge
